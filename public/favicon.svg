<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <radialGradient id="asGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5a3c"/>
      <stop offset="65%" stop-color="#e0231c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Icon Background -->
  <rect width="48" height="48" rx="12" fill="#05070a"/>
  
  <!-- Glowing Vermilion Core Moon -->
  <circle cx="24" cy="25" r="11" fill="url(#asGlow)" filter="url(#softGlow)"/>
  <circle cx="24" cy="25" r="5" fill="#ff5a3c"/>

  <!-- Futuristic Cyber A Monogram (AUTOSITES) -->
  <path d="M24 7 L40 39 H32.5 L24 22 L15.5 39 H8 L24 7 Z" fill="#dfe7e0"/>
  
  <!-- Inner Negative Space Cutout -->
  <path d="M24 15.5 L30 29 H18 L24 15.5 Z" fill="#05070a"/>

  <!-- Digital Accelerator Beam & Center Signal Node -->
  <line x1="12" y1="29" x2="36" y2="29" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="24" cy="29" r="2.5" fill="#ff5a3c" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Apex Signal Pulse -->
  <circle cx="24" cy="5" r="1.5" fill="#e0231c"/>
</svg>